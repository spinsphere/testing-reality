[package]
name = "quagmire-godot"
description = "Quagmire Engine SDK for Godot 4.7: GDExtension exposing QuagmireSystem and QuagmireScreen to GDScript."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
quagmire-core = { path = "../core" }
godot = { version = "0.5", features = ["api-4-7"] }
