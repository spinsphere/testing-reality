<svg width="100%" viewBox="0 0 680 310" xmlns="http://www.w3.org/2000/svg">

  <!-- Background -->
  <rect width="680" height="300" fill="#e8edf5" style="fill:rgb(232, 237, 245);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- Dashed connection line between circles -->
  <line x1="196" y1="130" x2="484" y2="130" stroke="#9b8fd4" stroke-width="1.2" stroke-dasharray="6 5" opacity="0.7" style="fill:rgb(0, 0, 0);stroke:rgb(155, 143, 212);color:rgb(255, 255, 255);stroke-width:1.2px;stroke-dasharray:6px, 5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.7;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- Particle A: left circle -->
  <circle cx="168" cy="130" r="44" fill="#e8705a" opacity="0.92" style="fill:rgb(232, 112, 90);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.92;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <circle cx="168" cy="130" r="44" fill="none" stroke="#c95842" stroke-width="1" opacity="0.5" style="fill:none;stroke:rgb(201, 88, 66);color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.5;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- Up arrow inside left circle -->
  <line x1="168" y1="152" x2="168" y2="114" stroke="#c4b8f0" stroke-width="1.8" stroke-linecap="round" style="fill:rgb(0, 0, 0);stroke:rgb(196, 184, 240);color:rgb(255, 255, 255);stroke-width:1.8px;stroke-linecap:round;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <polyline points="160,124 168,110 176,124" fill="none" stroke="#c4b8f0" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" style="fill:none;stroke:rgb(196, 184, 240);color:rgb(255, 255, 255);stroke-width:1.8px;stroke-linecap:round;stroke-linejoin:round;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- Particle B: right circle -->
  <circle cx="512" cy="130" r="44" fill="#e8705a" opacity="0.92" style="fill:rgb(232, 112, 90);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.92;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <circle cx="512" cy="130" r="44" fill="none" stroke="#c95842" stroke-width="1" opacity="0.5" style="fill:none;stroke:rgb(201, 88, 66);color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.5;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- Down arrow inside right circle -->
  <line x1="512" y1="108" x2="512" y2="146" stroke="#c4b8f0" stroke-width="1.8" stroke-linecap="round" style="fill:rgb(0, 0, 0);stroke:rgb(196, 184, 240);color:rgb(255, 255, 255);stroke-width:1.8px;stroke-linecap:round;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <polyline points="504,136 512,150 520,136" fill="none" stroke="#c4b8f0" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" style="fill:none;stroke:rgb(196, 184, 240);color:rgb(255, 255, 255);stroke-width:1.8px;stroke-linecap:round;stroke-linejoin:round;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- Label: particle A -->
  <text x="168" y="200" text-anchor="middle" font-family="'Anthropic Sans', sans-serif" font-size="12" fill="#7a93ab" opacity="0.9" style="fill:rgb(122, 147, 171);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.9;font-family:&quot;Anthropic Sans&quot;, sans-serif;font-size:12px;font-weight:400;text-anchor:middle;dominant-baseline:auto">particle A</text>

  <!-- Label: particle B -->
  <text x="512" y="200" text-anchor="middle" font-family="'Anthropic Sans', sans-serif" font-size="12" fill="#7a93ab" opacity="0.9" style="fill:rgb(122, 147, 171);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.9;font-family:&quot;Anthropic Sans&quot;, sans-serif;font-size:12px;font-weight:400;text-anchor:middle;dominant-baseline:auto">particle B</text>

</svg>